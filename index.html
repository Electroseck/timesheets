<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Electroseck Timesheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F1F1; --panel:#FFFFFF; --fg:#161414; --muted:#6B6363; --line:#E2DDDD;
  --accent:#DA1F26; --accent-ink:#8E1B1B; --accent-soft:#F7E3E3; --head:#151313; --ok:#1E7A4F; --ok-soft:#E3F2EA;
  --display:'Anton',Impact,'Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121010; --panel:#1C1919; --fg:#F2EEEE; --muted:#A79E9E; --line:#2E2828; --accent:#EF4A4F; --accent-ink:#F07B72; --accent-soft:#2D1A1A; --head:#0A0909; --ok:#4CC08A; --ok-soft:#143024; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:#fff;padding-block:22px 18px}
header .wrap{display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px}
.bolt{width:20px;height:26px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
header p{margin:0;color:#CFC8C8;font-size:15px}
main{padding-block:16px 130px;display:flex;flex-direction:column;gap:12px}
.hello{font-size:18px;font-weight:600;margin:0}
.explain{font-size:14.5px;color:var(--muted);margin:0}
.banner{border-radius:12px;padding:12px 14px;font-size:15px}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.banner.err{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.day.off{opacity:.8}
.day.today{border:2px solid var(--accent)}
.saved{font-family:var(--mono);font-size:11px;color:#CFC8C8}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.dh h2 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--muted);margin-left:6px}
.hrs{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr);gap:8px}
.row.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400}
input[type=time]{padding:9px 6px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step{display:flex;align-items:stretch;gap:6px}
.step button{font:800 20px var(--body);width:44px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.step input{text-align:center;font-family:var(--mono)}
.jobs{display:flex;flex-direction:column;gap:6px}
.jl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.addjob{align-self:flex-start;font:600 14px var(--body);padding:6px 10px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--accent-ink);cursor:pointer}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-self:end}
.tools button{font:600 13.5px var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.lv select{border-color:var(--accent);font-weight:600}
.calc{font-size:13px;color:var(--muted);margin:0}.calc b{color:var(--fg);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);margin-left:4px;vertical-align:1px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--head);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px}
.tot{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tot span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#CFC8C8}
.tot b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.done{font:800 16px var(--body);padding:12px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;flex:none}
.done:disabled{opacity:.6;cursor:default}
.done.sent{background:var(--ok)}
.weeknav{display:flex;justify-content:space-between;gap:8px}
.weeknav button{font:600 14px var(--body);padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.gl{display:flex;flex-direction:column;gap:0}
.gi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.gi:first-child{border-top:0}
.gi .t{flex:1;min-width:0}
.gi .t small{display:block;color:var(--muted);font-size:13px}
.gi .amt{font-family:var(--mono);font-weight:500;white-space:nowrap}
.gi img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
.sb{font:600 13px var(--body);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;margin-top:6px;margin-right:6px}
.gadd{font:800 15px var(--body);padding:11px 14px;border-radius:10px;border:0;background:var(--head);color:#fff;cursor:pointer}
.gmsg{font-size:14px;margin:0;color:var(--muted)}.gmsg.err{color:var(--accent-ink);font-weight:600}.gmsg.ok{color:var(--ok);font-weight:600}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:15.5px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><svg class="bolt" viewBox="0 0 24 30" aria-hidden="true"><path d="M15 0 3 17h8l-3 13 13-18h-8z" fill="#DA1F26"/></svg><h1>Timesheet</h1></div>
  <p id="wkline">Loading your week…</p>
</div></header>

<main class="wrap" id="main">
  <div class="empty" id="loading">Loading your timesheet…</div>
</main>

<div class="foot" id="foot" hidden><div class="wrap">
  <div class="tot"><span>Week total <span class="saved" id="saved"></span></span><b id="wk">0.0 hrs</b></div>
  <button type="button" class="done" id="done">Done – send to Emma</button>
</div></div>

<script>
(function(){
const SB='https://refvgqfirhjfxsatyuto.supabase.co/rest/v1/rpc/';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZnZncWZpcmhqZnhzYXR5dXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjAyMzEsImV4cCI6MjEwNjgzNjIzMX0.cYUkiH-V5Gj86m_l5D9yyPYhzJIwINxHa9Kiz_oyuhI';
const params=new URLSearchParams(location.search);
const token=(params.get('t')||'').trim();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dname=iso=>DOW[new Date(iso+'T00:00:00').getDay()];
const isWknd=iso=>{const g=new Date(iso+'T00:00:00').getDay();return g===0||g===6};
let NAMES=[], DATES=[], wkEnd=null;
const LEAVE={sick:'Sick day (paid)',annual:'Holiday (paid)',unpaid:'Day off – no pay'};
let STD={start:'06:30',finish:'14:30',break:30};
let week=null, data=null, st=[], jobs=[], dirty=false;
let gear=[], gf={what:'',amount:'',job:'',date:'',photo:null,photoName:''}, gBusy=false;

async function rpc(fn,body){
  const r=await fetch(SB+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Server said '+r.status);
  return r.json();
}
const pad=n=>String(n).padStart(2,'0');
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nice(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}
const mins=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
function hrs(d){if(d.leave)return 0;const a=mins(d.start),b=mins(d.finish);if(a==null||b==null||b<=a)return 0;return Math.max(0,(b-a-(+d.break||0))/60)}
const fmt=n=>{const r=Math.round(n*100)/100;return (r%1===0?r.toFixed(1):String(r))};

async function load(wk){
  if(!token){$('main').innerHTML='<div class="empty">This page needs your own timesheet link. Open the link in this week\'s timesheet email from Electroseck.</div>';$('wkline').textContent='';return}
  try{ data=await rpc('ts_get',{p_token:token,p_week:wk||null}); }
  catch(e){ $('main').innerHTML='<div class="banner err">Couldn\'t load your timesheet. Check you have signal and refresh the page. ('+esc(e.message)+')</div>'; return; }
  if(data.error){ $('main').innerHTML='<div class="banner err">This link isn\'t working. Ask Emma to send you a new one.</div>'; $('wkline').textContent=''; return; }
  STD=data.std||STD; week=data.week_start; jobs=data.jobs||[];
  wkEnd=data.week_end||addDays(week,6); DATES=[]; for(let d=week;d<=wkEnd;d=addDays(d,1)) if(dname(d)!=='Sun') DATES.push(d); NAMES=DATES.map(dname);
  gear=[]; try{ const g=await rpc('ts_exp_list',{p_token:token,p_week:week}); gear=(g&&g.items)||[]; }catch(e){}
  const saved={}; (data.days||[]).forEach(d=>saved[d.date]=d);
  st=DATES.map((date,i)=>{const s=saved[date];
    if(s) return {date,start:s.start||'',finish:s.finish||'',break:s.break||0,travel:+s.travel||0,leave:s.leave||'',jobs:(s.jobs&&s.jobs.length?s.jobs:[''])};
    const future=data.today&&date>data.today;
    if((data.status==='submitted'||data.status==='approved')||future||isWknd(date)) return {date,start:'',finish:'',break:0,travel:0,leave:'',jobs:[''],future};
    return {date,start:STD.start,finish:STD.finish,break:STD.break,travel:0,leave:'',jobs:['']};
  });
  dirty=false; render();
}
function render(){
  $('wkline').textContent='Week '+dname(week)+' '+nice(week)+' – '+dname(wkEnd)+' '+nice(wkEnd)+' · send to Emma by 3pm '+dname(wkEnd)+' '+nice(wkEnd);
  let h='<p class="hello">G\'day '+esc(data.name)+'</p>';
  if(data.status==='approved') h+='<div class="banner ok">Emma has already approved this week. If something\'s wrong, give her a call.</div>';
  else if(data.status==='draft') h+='<div class="banner ok" style="background:var(--panel);color:var(--fg);border-color:var(--line)">Saved as you go. Emma can\'t see it as finished until you tap Done.</div>';
  else if(data.status==='submitted') h+='<div class="banner ok">Sent to Emma '+new Date(data.submitted_at).toLocaleString('en-AU',{weekday:'short',hour:'numeric',minute:'2-digit'})+'. You can still fix it and send again until she approves it.</div>';
  h+='<p class="explain">Fill in each day as you go. It saves by itself, so just close it when you\'re done for the day. Days start filled in at '+to12(STD.start)+' to '+to12(STD.finish)+' with a '+STD.break+' min break, so fix anything different and write where you were. At the end of the week, tap Done to send it to Emma. Off sick, on holiday or took an unpaid day? Pick it in the "Day off?" box on that day. Start and finish are your work times. Put driving to far jobs (like Brisbane) before '+to12(STD.start)+' or after '+to12(STD.finish)+' in Travel hrs.</p>';
  h+='<div class="weeknav"><button type="button" id="prev">← Earlier week</button><button type="button" id="next">Later week →</button></div>';
  h+='<datalist id="jl">'+jobs.map(j=>'<option value="'+esc(j)+'">').join('')+'</datalist>';
  const locked=data.status==='approved';
  st.forEach((d,i)=>{
    const hr=hrs(d),off=hr===0&&!+d.travel;
    const lsel='<label class="f lv">Day off?<select id="lv-'+i+'" data-i="'+i+'" data-k="leave"'+(locked?' disabled':'')+'><option value=""'+(!d.leave?' selected':'')+'>No – worked</option>'+Object.keys(LEAVE).map(k=>'<option value="'+k+'"'+(d.leave===k?' selected':'')+'>'+LEAVE[k]+'</option>').join('')+'</select></label>';
    const isToday=data.today===d.date;
    if(d.future&&!d.start&&!d.leave&&!d.jobs.some(x=>x.trim())){h+='<section class="day off"><div class="dh"><h2>'+NAMES[i]+'<small>'+nice(d.date)+'</small></h2><span class="hrs">Coming up</span></div>'+(locked?'':'<button type="button" class="addjob" data-fill="'+i+'">Fill in this day</button>')+'</section>';return}
    h+='<section class="day'+(off?' off':'')+(isToday?' today':'')+'"><div class="dh"><h2>'+NAMES[i]+'<small>'+nice(d.date)+(isToday?' · today':'')+'</small></h2><span class="hrs">'+(d.leave?LEAVE[d.leave]:off?'Not worked':fmt(hr)+' hrs')+(isWknd(d.date)&&!off&&!d.leave?'<span class="tag">'+NAMES[i]+'</span>':'')+'</span></div>';
    if(d.leave){h+=lsel+'<p class="calc">'+(d.leave==='unpaid'?'Emma won\'t pay this day.':'Emma will pay this as '+(d.leave==='sick'?'sick leave':'holiday pay')+'.')+' Change it back to "No – worked" if that\'s wrong.</p></section>';return}
    h+='<div class="row"><label class="f">Start<input type="time" id="s-'+i+'" data-i="'+i+'" data-k="start" value="'+esc(d.start)+'"'+(locked?' disabled':'')+'></label><label class="f">Finish<input type="time" id="f-'+i+'" data-i="'+i+'" data-k="finish" value="'+esc(d.finish)+'"'+(locked?' disabled':'')+'></label><label class="f">Break<select id="b-'+i+'" data-i="'+i+'" data-k="break"'+(locked?' disabled':'')+'>'+[0,15,30,45,60].map(v=>'<option value="'+v+'"'+(+d.break===v?' selected':'')+'>'+v+' min</option>').join('')+'</select></label></div>';
    h+='<div class="row two"><label class="f">Travel hrs<div class="step"><button type="button" data-step="'+i+'" data-d="-0.5" aria-label="Less travel"'+(locked?' disabled':'')+'>−</button><input id="tr-'+i+'" inputmode="decimal" data-i="'+i+'" data-k="travel" value="'+d.travel+'"'+(locked?' disabled':'')+'><button type="button" data-step="'+i+'" data-d="0.5" aria-label="More travel"'+(locked?' disabled':'')+'>+</button></div></label><div class="tools">'+(i>0&&!locked?'<button type="button" data-same="'+i+'">Same as yesterday</button>':'')+'</div></div>'+lsel;
    h+='<div class="jobs"><span class="jl">Where were you? Type anything, or pick a job</span>'+d.jobs.map((v,k)=>'<input list="jl" id="job-'+i+'-'+k+'" data-i="'+i+'" data-j="'+k+'" value="'+esc(v)+'" placeholder="Job number, site or address" aria-label="'+NAMES[i]+' place '+(k+1)+'"'+(locked?' disabled':'')+'>').join('')+(d.jobs.length<4&&!locked?'<button type="button" class="addjob" data-add="'+i+'">+ Another place</button>':'')+'</div>';
    if(hr>0) h+='<p class="calc">'+to12(d.start)+' to '+to12(d.finish)+', less '+d.break+' min break = <b>'+fmt(hr)+' hrs</b>'+(+d.travel?' · plus <b>'+fmt(+d.travel)+' hrs</b> travel':'')+'</p>';
    h+='</section>';
  });
  h+='<label class="f">Anything Emma should know? (optional)<textarea id="note" rows="2"'+(locked?' disabled':'')+'>'+esc(data.note||'')+'</textarea></label>';
  h+='<section class="day" id="gearsec"></section>';
  $('main').innerHTML=h; $('foot').hidden=false; renderGear(); total();
  $('done').disabled=locked; $('done').textContent=locked?'Approved':(data.status==='submitted'?'Send again to Emma':'Done – send to Emma'); $('done').classList.toggle('sent',locked);
}
function to12(t){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+(m?':'+pad(m):'')+ap}
function total(){let t=0,tr=0,lv=0;st.forEach(d=>{t+=hrs(d);tr+=+d.travel||0;if(d.leave&&d.leave!=='unpaid')lv++});const g=gearTotal();$('wk').textContent=fmt(t)+' hrs'+(tr?' + '+fmt(tr)+' travel':'')+(lv?' + '+lv+' leave day'+(lv>1?'s':''):'')+(g?' · $'+g.toFixed(2)+' gear':'');}
/* ---------- gear paid for by crew ---------- */
const money=n=>'$'+(+n).toFixed(2);
function gearTotal(){return gear.reduce((s,x)=>s+(+x.amount||0),0)}
function renderGear(){
  const el=$('gearsec'); if(!el) return;
  const locked=data.status==='approved', g=gearTotal();
  if(!gf.date) gf.date=(data.today&&data.today>=week&&data.today<=wkEnd&&dname(data.today)!=='Sun')?data.today:week;
  let h='<div class="dh"><h2>Gear you paid for<small>you get it back</small></h2><span class="hrs">'+(g?money(g):'')+'</span></div>';
  h+='<p class="calc">Bought something for work with your own money? Put in what it was, how much, and take a photo of the receipt. Emma pays it back with your wages, no tax on it.</p>';
  h+='<div class="gl">'+(gear.length?gear.map(x=>'<div class="gi"><div class="t"><b>'+esc(x.what)+'</b><small>'+(x.date?nice(x.date):'')+(x.job?' · '+esc(x.job):'')+(x.status==='paid'?' · paid back':'')+'</small>'+
    (x.has_photo?'<button type="button" class="sb" data-rcpt="'+x.id+'">Show receipt</button>':'<small>No receipt photo</small>')+
    (!locked&&x.status==='claimed'?'<button type="button" class="sb" data-gdel="'+x.id+'">Remove</button>':'')+
    '</div><span class="amt">'+money(x.amount)+'</span></div>').join(''):'<p class="calc">Nothing this week.</p>')+'</div>';
  if(!locked){
    const dayOpts=DATES.map((d,i)=>{const n=NAMES[i];return '<option value="'+d+'"'+(d===gf.date?' selected':'')+'>'+n+' '+nice(d)+'</option>'}).join('');
    h+='<div class="row two"><label class="f">What did you buy?<input id="gx-what" value="'+esc(gf.what)+'" placeholder="e.g. Drill bits, Bunnings"></label><label class="f">How much? ($ inc GST)<input id="gx-amt" inputmode="decimal" value="'+esc(gf.amount)+'" placeholder="0.00"></label></div>';
    h+='<div class="row two"><label class="f">Which job? (optional)<input id="gx-job" list="jl" value="'+esc(gf.job)+'" placeholder="Job number or site"></label><label class="f">Day<select id="gx-date">'+dayOpts+'</select></label></div>';
    h+='<label class="f">Photo of the receipt<input type="file" id="gx-photo" accept="image/*" capture="environment"></label>'+(gf.photo?'<p class="gmsg ok">Receipt photo ready ✓</p>':'');
    h+='<button type="button" class="gadd" id="gx-add">Add gear</button><p class="gmsg" id="gx-msg"></p>';
  }
  el.innerHTML=h;
  el.oninput=e=>{const t=e.target;if(t.id==='gx-what')gf.what=t.value;else if(t.id==='gx-amt')gf.amount=t.value;else if(t.id==='gx-job')gf.job=t.value};
  el.onchange=async e=>{e.stopPropagation();const t=e.target;
    if(t.id==='gx-date')gf.date=t.value;
    if(t.id==='gx-photo'){const m=$('gx-msg');m.className='gmsg';m.textContent='Getting the photo ready…';gf.photo=await shrink(t);m.textContent='';renderGear();}};
  el.onclick=async e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.id==='gx-add')return addGear(b);
    if(b.dataset.gdel){if(!confirm('Remove this from your timesheet?'))return;b.disabled=true;
      try{const r=await rpc('ts_exp_delete',{p_token:token,p_id:+b.dataset.gdel});if(r.ok){gear=gear.filter(x=>x.id!=b.dataset.gdel);renderGear();total()}else{b.disabled=false;b.textContent="Can't remove"}}catch(err){b.disabled=false;b.textContent='No signal, try again'}}
    if(b.dataset.rcpt){b.disabled=true;b.textContent='Loading…';
      try{const src=await rpc('ts_exp_photo',{p_token:token,p_id:+b.dataset.rcpt});if(src){const img=document.createElement('img');img.src=src;img.alt='Receipt';b.replaceWith(img)}else b.textContent='Photo not found'}catch(err){b.disabled=false;b.textContent='No signal, try again'}}
  };
}
async function addGear(b){
  const m=$('gx-msg'),amt=parseFloat(String(gf.amount).replace(/[$,\s]/g,''));
  m.className='gmsg err';
  if(gf.what.trim().length<2){m.textContent='Write what you bought.';return}
  if(!(amt>0)||amt>=10000){m.textContent='Put in the amount, e.g. 45.90';return}
  if(!gf.photo&&b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='No receipt photo – tap to add anyway';m.textContent='Emma needs the receipt to pay you back. Take a photo if you can.';return}
  if(gBusy)return;gBusy=true;b.disabled=true;b.textContent='Adding…';m.className='gmsg';m.textContent='';
  try{const r=await rpc('ts_exp_add',{p_token:token,p_week:week,p_date:gf.date||null,p_amount:amt,p_what:gf.what.trim(),p_job:gf.job.trim()||null,p_photo:gf.photo});
    if(r.error){b.disabled=false;b.textContent='Add gear';m.className='gmsg err';m.textContent=r.error==='already_approved'?'Emma has already approved this week. Give her a call.':r.error==='bad_photo'?'That photo didn\'t work. Try taking it again.':'Couldn\'t add it. Check the amount.';gBusy=false;return}
    gear.push({id:r.id,date:gf.date,amount:Math.round(amt*100)/100,what:gf.what.trim(),job:gf.job.trim()||null,has_photo:!!gf.photo,status:'claimed'});
    gf={what:'',amount:'',job:'',date:gf.date,photo:null};gBusy=false;renderGear();total();
    const m2=$('gx-msg');if(m2){m2.className='gmsg ok';m2.textContent='Added. Emma can see it now.'}
  }catch(err){gBusy=false;b.disabled=false;b.textContent='No signal? Tap to try again'}
}
async function shrink(input){
  const f=input.files&&input.files[0]; if(!f) return null;
  try{const bmp=await createImageBitmap(f);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.78);
  }catch(e){return await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)})}
}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='note'){data.note=el.value;dirty=true;queueSave();return}if(el.dataset.i==null)return;const i=+el.dataset.i;
  if(el.dataset.j!=null) st[i].jobs[+el.dataset.j]=el.value;
  else if(el.dataset.k==='travel') st[i].travel=Math.max(0,Math.min(16,parseFloat(el.value)||0));
  else if(el.dataset.k==='leave'){st[i].leave=el.value; if(el.value){Object.assign(st[i],{start:'',finish:'',break:0,travel:0,jobs:['']})} else if(!st[i].start){Object.assign(st[i],{start:STD.start,finish:STD.finish,break:STD.break})}}
  else st[i][el.dataset.k]=el.dataset.k==='break'?+el.value:el.value;
  dirty=true; if(el.dataset.j==null) render(); else total(); queueSave();});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='prev'||b.id==='next'){ if(dirty&&b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Unsent changes – tap again';return} load(b.id==='prev'?(data.prev_week||addDays(week,-7)):(data.next_week||addDays(week,7))); return }
  if(b.dataset.step!=null){const i=+b.dataset.step;st[i].travel=Math.max(0,Math.min(16,(+st[i].travel||0)+(+b.dataset.d)));dirty=true;render();queueSave();return}
  if(b.dataset.same!=null){const i=+b.dataset.same,p=st[i-1];Object.assign(st[i],{start:p.start||STD.start,finish:p.finish||STD.finish,break:p.break,travel:p.travel});if(!st[i].jobs.some(x=>x.trim()))st[i].jobs=p.jobs.slice();dirty=true;render();queueSave();return}
  if(b.dataset.fill!=null){const i=+b.dataset.fill;Object.assign(st[i],{start:STD.start,finish:STD.finish,break:STD.break,future:false});dirty=true;render();queueSave();return}
  if(b.dataset.add!=null){const i=+b.dataset.add;st[i].jobs.push('');render();const el=$('job-'+i+'-'+(st[i].jobs.length-1));if(el)el.focus();return}
  if(b.id==='done'){
    const worked=st.filter(d=>hrs(d)>0||+d.travel>0);
    const noPlace=worked.filter(d=>!d.jobs.some(x=>x.trim()));
    if(noPlace.length&&b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='No place on '+noPlace.length+' day(s) – tap to send anyway';return}
    b.disabled=true;b.textContent='Sending…';
    clearTimeout(saveT);const days=payload();
    try{const r=await rpc('ts_submit',{p_token:token,p_week:week,p_days:days,p_note:(data.note||'').trim()||null});
      if(r.error){b.disabled=false;b.dataset.ok='';b.textContent=r.error==='already_approved'?'Already approved':'Try again';return}
      data.status='submitted';data.submitted_at=r.submitted_at;dirty=false;render();$('done').textContent='Sent to Emma ✓';$('done').classList.add('sent');
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(err){b.disabled=false;b.textContent='No signal? Tap to try again'}
  }
});
function payload(){return st.filter(d=>d.leave||d.start||d.finish||+d.travel||d.jobs.some(x=>x.trim())).map(d=>({date:d.date,start:d.leave?'':d.start,finish:d.leave?'':d.finish,break:d.leave?0:(+d.break||0),travel:+d.travel||0,leave:d.leave||null,jobs:d.jobs.filter(x=>x.trim())}))}
let saveT=null,saving=false;
function queueSave(){if(!data||data.status==='approved')return;clearTimeout(saveT);$('saved').textContent='· saving…';saveT=setTimeout(saveNow,1200)}
async function saveNow(){if(saving){queueSave();return}saving=true;
  try{const r=await rpc('ts_save',{p_token:token,p_week:week,p_days:payload(),p_note:(data.note||'').trim()||null});
    if(r.ok){dirty=false;if(data.status==='new')data.status=r.status;$('saved').textContent='· saved '+new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});}
    else $('saved').textContent='· not saved';
  }catch(e){$('saved').textContent='· no signal, not saved yet'}finally{saving=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty){clearTimeout(saveT);saveNow()}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load(null);
})();
</script>
</body>
