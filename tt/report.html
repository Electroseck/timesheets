<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Electroseck Test &amp; Tag Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#161414;--muted:#6B6363;--line:#E2DDDD;--red:#DA1F26;--head:#151313;--ok:#1E7A4F;--bad:#8E1B1B;--badbg:#F7E3E3;--warn:#8A5A00;--warnbg:#FBF0D9;--display:'Anton',Impact,'Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E9E6E6;color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.4}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
.bar button{font:inherit;font-weight:800;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.bar .p{background:var(--red);border-color:var(--red);color:#fff}
.page{width:297mm;margin:16px auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@media (max-width:1180px){.page{width:auto;margin:12px}}
.hd{background:var(--head);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hd img{height:44px;width:auto;display:block}
.hd .t{font-family:var(--display);font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.hd .co{text-align:right;font-size:11.5px;color:#D8D2D2;line-height:1.5}
.redline{height:5px;background:var(--red)}
.body{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 22px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
@media (max-width:700px){.meta{grid-template-columns:1fr}}
.meta div{display:flex;flex-direction:column}
.meta span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.meta b{font-weight:600;font-size:13.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead{display:table-header-group}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red);font-weight:700;padding:6px 8px;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);white-space:nowrap}
td.c{text-align:center;font-weight:800}
tr.g td{background:#F3F1F1;font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:8px}
tr.F td{background:var(--badbg)}tr.F td.c{color:var(--bad)}
tr.N td.c{color:var(--warn)}
tr{page-break-inside:avoid}
.tot{display:flex;gap:26px;flex-wrap:wrap;font-weight:800;font-size:14px}
.tot .f{color:var(--bad)}
.fine{color:var(--muted);font-size:11px;margin:0}
.note{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px}
.sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin-top:10px}
.sig div{border-top:1px solid var(--ink);padding-top:4px;font-size:11px;color:var(--muted)}
.ft{border-top:1px solid var(--line);padding:8px 24px;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.msg{text-align:center;padding:60px 16px;color:var(--muted)}
@page{size:A4 landscape;margin:10mm}
@media print{body{background:#fff}.bar{display:none}.page{width:auto;margin:0;box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

const fd=s=>{if(!s)return '';const [y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y};
const sp=new URLSearchParams(location.search);
let token=sp.get('t')||'';try{if(token)localStorage.setItem('es_token',token);else token=localStorage.getItem('es_token')||''}catch(e){}
const id=sp.get('r')||'';
const out=document.getElementById('out');
if(!token||!id){out.innerHTML='<p class="msg">Open this from the Test &amp; Tag page or Dayne’s hub.</p>';return}

.then(r=>r.ok?r.json():Promise.reject(r.status)).then(r=>{
