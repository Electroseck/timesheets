<title>Electroseck Calculation Report</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#161414;--muted:#6B6363;--line:#E2DDDD;--red:#DA1F26;--head:#151313;--ok:#1E7A4F;--okbg:#E3F2EA;--bad:#8E1B1B;--badbg:#F7E3E3;--display:'Anton',Impact,'Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E9E6E6;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
.bar button,.bar a{font:inherit;font-weight:800;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.bar .p{background:var(--red);border-color:var(--red);color:#fff}
.page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;flex-direction:column}
@media (max-width:820px){.page{width:auto;min-height:0;margin:12px}}
.hd{background:var(--head);color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hd img{height:46px;width:auto;display:block}
.hd .co{text-align:right;font-size:11.5px;color:#D8D2D2;line-height:1.5}
.hd .co b{color:#fff;font-size:13px}
.redline{height:5px;background:var(--red)}
.body{padding:22px 26px;display:flex;flex-direction:column;gap:16px;flex:1}
h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.05}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.meta div{display:flex;flex-direction:column}
.meta span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.meta b{font-weight:600;font-size:14px}
h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--ink)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:42%}
table.kv td:last-child{font-weight:600}
.verdict{border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.verdict.ok{background:var(--okbg);border:1.5px solid var(--ok)}.verdict.bad{background:var(--badbg);border:1.5px solid var(--red)}
.verdict .v{font-weight:800;font-size:18px}.verdict.ok .v{color:var(--ok)}.verdict.bad .v{color:var(--bad)}
.verdict .h{font-family:var(--mono);font-size:24px}
ul.notes{margin:0;padding-left:18px;color:var(--muted);font-size:12px}
.sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:6px}
.sig div{border-top:1px solid var(--ink);padding-top:4px;font-size:11.5px;color:var(--muted)}
.ft{border-top:1px solid var(--line);padding:10px 26px;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.msg{text-align:center;padding:60px 16px;color:var(--muted)}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm}.hd,.redline,.verdict{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

async function load(){

  (R.table2&&R.table2.rows&&R.table2.rows.length?'<div><h2>Demand by load group</h2>'+tbl(R.table2)+'</div>':'')+
